version: 2

# POLICY (2026-10-09) — one grouped pull request per package, once a week, majors excluded.
#
# WHY: the queue had reached 14 open pull requests, 8 of them major-version jumps (Expo SDK 58,
# React 19 types, TypeScript 7, jest 30, actions/checkout 7, actions/setup-node 7). Five of those
# were red, and none could be merged as-is — each needed code changes or a coordinated upgrade. The
# one or two PRs that were genuinely safe to merge were lost in the noise. Majors are now taken
# deliberately and tracked in issue #32, instead of standing open as permanently red PRs.
#
# WHAT THIS KEEPS: minor and patch updates, grouped per package, at most two open pull requests per
# package, on the same weekly schedule — a queue that should normally be empty or trivially green.
#
# WHAT SECURITY UPDATES DO: they are unaffected. GitHub's reference states that security-update pull
# requests are not subject to `open-pull-requests-limit` and do not count toward it, and that
# `update-types` filters version updates. A vulnerability fix therefore still arrives as its own
# pull request, immediately, regardless of the `ignore` rule below.
#
# TO TAKE A MAJOR DELIBERATELY: remove the `ignore` entry (or re-open the closed PR) for the upgrade
# being planned. Issue #32 lists each one with the CI failure that made it blocked. The same applies to
# any Expo SDK-pinned package in `mobile/`: it is taken with the SDK upgrade, not on its own — see the
# block comment beside that list.
#
# REMINDER: `main` cannot be protected at this plan level — branch protection and rulesets both
# answer `403 Upgrade to GitHub Pro or make this repository public` on a private repository
# (docs/SOURCE_PROTECTION.md §4). Nothing forces these checks to pass, so a red dependency PR must
# never be merged by hand.

updates:
  - package-ecosystem: npm
    directory: /server
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 2
    labels:
      - dependencies
    groups:
      server-minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  - package-ecosystem: npm
    directory: /mobile
    schedule:
      interval: weekly
      day: monday
      time: "06:15"
      timezone: Etc/UTC
    open-pull-requests-limit: 2
    labels:
      - dependencies
    groups:
      mobile-minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
      # EVERY Expo SDK-pinned package is refused here, not only the React/RN core. The rule is
      # mechanical rather than a judgement call: if the package is a key in the installed SDK's
      # `expo/bundledNativeModules.json`, Expo owns its version and Dependabot cannot know it.
      #
      # WHY THE SCOPE GREW (2026-10-11). The carve-out originally covered five packages, which made
      # Dependabot free to propose the other twelve — derived by reading `bundledNativeModules.json`,
      # 21 of the 30 packages the mobile manifest declares — dependencies AND devDependencies — are
      # SDK-pinned. That is exactly where the two failures came
      # from: PR #34 moved react-native/react/safe-area-context/screens outside SDK 57 (ISS-16), and
      # PR #38 proposed the SDK 57 patch rollup that cannot install at all — it nests
      # `expo-modules-core` where root-level `jest-expo` cannot resolve it, and declaring it directly
      # is an `ERESOLVE` against the `react-native-worklets` that `expo-router` forces (ISS-17,
      # roadmap §27AK). CI cannot see either failure class; the second one only appears at install
      # and the first only in a native build.
      #
      # HOW THEY MOVE INSTEAD: with an Expo SDK upgrade, deliberately, through
      # `npx expo install --fix` — the command that reads exactly these pins — under the runbook in
      # roadmap §27AI. Every entry below is measured against the installed SDK, so this list is
      # re-derived when the SDK moves rather than guessed.
      #
      # WHY FOUR ENTRIES WERE ADDED (2026-10-12, roadmap §27AY). The derivation above read
      # `dependencies` and missed the two SDK-pinned DEVdependencies, so `eslint-config-expo` and
      # `jest-expo` sat proposable even though the pin guard (`__tests__/expo-sdk-pins.test.ts`)
      # compares devDependencies too and rejects a move in either. The other two,
      # `react-native-reanimated` and `react-native-worklets`, became direct dependencies that day:
      # they had been resolved from `*` as optional peers to 4.7.1 / 0.13.0, which the installed
      # `expo-modules-core` reported invalid (`npm ls` ELSPROBLEMS), and the fix was to declare the
      # pair the pin table already named.
      #
      # WHY ONE MORE WAS ADDED (2026-10-21, the SDK 58 upgrade). `expo-build-properties` became a
      # direct dependency when `app.json` had to declare Android levels of its own (`minSdkVersion`
      # 24 and Kotlin 2.4.0). The SDK pins it like the rest, so the pin guard compared it and failed
      # until it was listed here — which is the guard doing exactly what it exists for.
      #
      # WHY ONE MORE WAS ADDED (2026-10-24, over-the-air updates). `expo-updates` became a direct
      # dependency when the app gained its update runtime. The SDK pins it like the rest, so the pin
      # guard compared it and failed until it was listed here — the same guard doing the same job.
      #
      # WHAT IS NOT SDK-PINNED: `@react-native-google-signin/google-signin` is a version choice this
      # project makes, so Dependabot may still propose it. (`expo` IS listed below: the SDK package
      # carries the upgrade, so it is taken deliberately.)
      #
      # WHY THE FIREBASE PAIR WAS ADDED (2026-10-31). `@react-native-firebase/app` and
      # `@react-native-firebase/auth` are not Expo-pinned, but the project freezes them as an exact
      # pair: `__tests__/phase1-rnfirebase-foundation.test.ts` requires both at `27.0.0`, because
      # `auth` peer-depends on one exact `app` version and a range would let the pair drift apart.
      # PR #98 proposed 27.1.0 and failed that guard by design. The pair moves with a deliberate
      # native upgrade and on-device verification, not as a minor-and-patch dependency update.
      #
      # Security updates remain unaffected by every rule in this list (see the header).
      - dependency-name: "@expo/vector-icons"
      - dependency-name: "@react-native-firebase/app"
      - dependency-name: "@react-native-firebase/auth"
      - dependency-name: eslint-config-expo
      - dependency-name: expo
      - dependency-name: expo-build-properties
      - dependency-name: expo-camera
      - dependency-name: expo-constants
      - dependency-name: expo-dev-client
      - dependency-name: expo-font
      - dependency-name: expo-linking
      - dependency-name: expo-print
      - dependency-name: expo-router
      - dependency-name: expo-secure-store
      - dependency-name: expo-sharing
      - dependency-name: expo-status-bar
      - dependency-name: expo-system-ui
      - dependency-name: expo-updates
      - dependency-name: jest-expo
      - dependency-name: react
      - dependency-name: react-dom
      - dependency-name: react-native
      - dependency-name: react-native-reanimated
      - dependency-name: react-native-safe-area-context
      - dependency-name: react-native-screens
      - dependency-name: react-native-worklets

  # The workflow actions are pinned to commit SHAs, so they need an updater of their own: without
  # this entry a pinned action would sit at its current SHA forever instead of receiving the fixes
  # the pin exists to make safe to take. Majors are excluded here too — the pins were re-taken at v7
  # on 2026-10-11 (checkout v7.0.1, setup-node v7.1.0, each read from the floating `v7` tag), and the
  # next major re-pin stays a deliberate change (issue #32).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Etc/UTC
    open-pull-requests-limit: 2
    labels:
      - dependencies
    groups:
      actions-minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
