name: production-health-dispatch

# Hosted fallback for production-health-watch-v2.yml.
#
# The v2 workflow is active but GitHub has never emitted an event=schedule run for it, even after
# the cron moved from a range-step to the canonical */5 form. This workflow is a separate scheduled
# workflow with no credential of its own: it dispatches v2 through the repository's GITHUB_TOKEN
# (workflow_dispatch is the one event GitHub allows a GITHUB_TOKEN to create). It runs on GitHub,
# so production monitoring no longer depends on the operator's laptop being online.
#
# The dispatcher skips when a v2 run is already queued or active, matching scripts/trigger-production-health-watch.ps1.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  actions: write

concurrency:
  group: production-health-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Dispatch the production health watch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          active=$(gh run list --repo "$REPO" --workflow production-health-watch-v2.yml --limit 20 --json status --jq '[.[] | select(.status == "queued" or .status == "in_progress" or .status == "requested" or .status == "waiting" or .status == "pending")] | length')
          if [ "$active" -gt 0 ]; then
            echo "Skipping: $active production-health-watch-v2 run(s) already queued or active."
            exit 0
          fi
          gh workflow run production-health-watch-v2.yml --repo "$REPO"
